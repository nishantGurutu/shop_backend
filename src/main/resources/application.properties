spring.application.name=kisan-daily-api
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-binding-errors=never
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/kisan;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
app.session-hours=${SESSION_HOURS:168}
app.auth-requests-per-minute=${AUTH_REQUESTS_PER_MINUTE:20}
app.cors-origins=${CORS_ORIGINS:http://localhost:8765,http://127.0.0.1:8765,http://localhost:3000,http://127.0.0.1:3000}
