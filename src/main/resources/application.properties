spring.datasource.username=farmer_db_jzs0_user
spring.datasource.password=vKbYXIsF7T9ZywAFvC85Pki5cgvidWFW
# spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
logging.level.org.springframework.data.jpa.repository.query=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
server.port=${PORT:8080}
server.address=0.0.0.0
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Swagger UI: http://localhost:8080/

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# CORS - comma separated origins allowed to call backend APIs (development)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://school-dashboard-one-sepia.vercel.app}

# File upload
app.upload.dir=uploads

# Face verification microservice (FastAPI)
app.face-verify.base-url=http://127.0.0.1:8000
app.face-verify.enabled=true

# Shared homework and curriculum attachments
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Secrets are read only by the backend. Keep live/test credentials in the environment.
school.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
school.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

school.push.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:}
