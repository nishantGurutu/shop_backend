# Isolated local development profile; does not connect to the configured PostgreSQL server.
spring.datasource.url=jdbc:h2:file:./data/kisan;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.data.jpa.repository.query=INFO
server.address=127.0.0.1
app.cors-origins=http://localhost:8765,http://127.0.0.1:8765,http://localhost:3000,http://127.0.0.1:3000
